name: transit
version: 0.1.0

transport: stdio
command: ["/opt/vh/mod/transit/bin/python", "-m", "vahub_mod_transit"]

config:
  required: []
  optional: [TRANSIT_API_URL, TZ_DEFAULT]

runtime:
  uid: null
  cwd: /var/lib/vahub/modules/transit
  pythonpath: /app/project/modules/transit   # dev only: live code from the mount

health:
  interval_s: 60
  timeout_s: 8

restart:
  max_retries: 5
  backoff_base_s: 2
  reset_after_s: 600
  startup_timeout_s: 20

audit:
  redact: []

tools:
  find_connections: { class: read }
  next_departures:  { class: read }
