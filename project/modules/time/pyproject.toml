[project]
name = "vahub-mod-time"
version = "0.1.0"
description = "vahub time module (MCP server over stdio)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.4,<2",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vahub_mod_time"]
