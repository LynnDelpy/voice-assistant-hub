[project]
name = "vahub-mod-notify"
version = "0.1.0"
description = "vahub push-notification module (MCP server over stdio)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.4,<2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vahub_mod_notify"]
