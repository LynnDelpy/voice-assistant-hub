# Overlay: talk to YOUR Home Assistant instead of the simulated one.
# Enable with `./sandbox.sh up --real-ha`.
#
# Set HA_URL and HA_TOKEN in ../.env (create the token in Home Assistant under
# profile -> Security -> Long-lived access tokens). Remember that the policy
# gate in ../config/policy.yaml lists which entity ids may be controlled, so
# add yours there or control commands will be denied.
services:
  hub:
    # Replace (not merge) the dependency list: the simulated HA is not started
    # in this mode, so drop the wait on it, but KEEP waiting for ntfy, which is
    # still part of the stack. `!reset []` here would silently drop ntfy too and
    # let the hub race ahead of the notification backend.
    depends_on: !override
      ntfy:
        condition: service_healthy
    environment:
      # Undo the demo-mode overrides from the base file so the values from
      # ../.env apply. The token is passed directly rather than through the
      # ha-init token file, which only exists in demo mode.
      HA_URL: "${HA_URL:?set HA_URL in .env, e.g. https://ha.example.com or http://192.168.1.50:8123}"
      HA_TOKEN: "${HA_TOKEN:?create a long-lived token in Home Assistant and set HA_TOKEN in .env}"
      HA_TOKEN_FILE: ""
      HA_VERIFY_SSL: "${HA_VERIFY_SSL:-true}"
      NTFY_URL: "${NTFY_URL:-http://ntfy:80}"

  # The simulated home is not part of this mode.
  homeassistant:
    profiles: ["disabled"]

  ha-init:
    profiles: ["disabled"]
