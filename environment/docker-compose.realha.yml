# Overlay: point the hub at YOUR real Home Assistant instead of the sandbox's
# simulated one. The simulated HA (homeassistant + ha-init) does not start here.
#
# 1. In your Home Assistant: profile -> Security -> Long-lived access tokens ->
#    Create Token. Copy it.
# 2. Put these in environment/.env (gitignored, never committed):
#      HA_URL=http://<your-ha-ip>:8123
#      HA_TOKEN=<the long-lived token>
#    Use an IP or a real DNS name, not a .local mDNS name (it will not resolve
#    inside the container). For self-signed HTTPS add HA_VERIFY_SSL=false.
# 3. Update project/config/policy.yaml so the gate allows your entity ids
#    (the sandbox policy only allows the demo's German names).
# 4. Run it:  ./sandbox.sh real-ha
#    (or: docker compose -f docker-compose.yml -f docker-compose.realha.yml up -d)

services:
  hub:
    # The sandbox HA is not started in this mode, so do not wait for it.
    depends_on: !reset []
    environment:
      HA_URL: "${HA_URL:?set HA_URL in environment/.env, e.g. http://192.168.1.50:8123}"
      HA_TOKEN: "${HA_TOKEN:?create a long-lived token in your HA and set HA_TOKEN in environment/.env}"
      HA_TOKEN_FILE: ""
      HA_VERIFY_SSL: "${HA_VERIFY_SSL:-true}"

  homeassistant:
    profiles: ["disabled"]

  ha-init:
    profiles: ["disabled"]
