services:
  hub:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: vahub:dev
    container_name: vahub
    ports:
      # Default binds 0.0.0.0, so the hub is reachable from the LAN. The hub has
      # NO auth of its own, and /api/dev/call executes tools directly, so anyone
      # who can reach this port can drive your home. Lock it down with either:
      #   HUB_BIND=127.0.0.1   (loopback only; use the mTLS proxy for remote)
      # or a firewall rule. Note docker's iptables rules bypass most host firewalls.
      - "${HUB_BIND:-0.0.0.0}:8080:8080"
    volumes:
      # Live code, read-only from inside the container.
      - ../project:/app/project:ro
      # Config and module manifests.
      - ../project/config:/etc/vahub:ro
      # Disposable state. `docker compose down -v` wipes this volume: clean slate.
      - vahub-state:/var/lib/vahub
      # The HA long-lived token, written by ha-init (read-only here).
      - ha-tokens:/tokens:ro
    environment:
      VAHUB_CONFIG: /etc/vahub/config.yaml
      TZ_DEFAULT: Europe/Berlin
      # Real Home Assistant on the internal network. The token is not inline: the
      # module reads it from HA_TOKEN_FILE (the same file-based path prod uses via
      # a systemd credential). ha-init writes that file.
      HA_URL: http://homeassistant:8123
      HA_TOKEN: ""
      HA_TOKEN_FILE: /tokens/ha_token
      HA_VERIFY_SSL: "false"
      # Self-hosted ntfy (see the ntfy service below). NTFY_URL uses the
      # internal container name/port, not the host-published one.
      NOTIFY_BACKEND: ntfy
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: vahub-alerts
      # LLM API key, read from environment/.env (gitignored). Empty if unset.
      VAHUB_LLM__API_KEY: "${VAHUB_LLM__API_KEY:-}"
    depends_on:
      homeassistant:
        condition: service_healthy
      ha-init:
        condition: service_completed_successfully
      ntfy:
        condition: service_healthy
    # The hub manages its own module subprocesses; a hub crash should be visible,
    # not silently restarted.
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Real Home Assistant with virtual (mocked) devices from configuration.yaml.
  # No physical hardware. First boot takes ~30-60s. Not published to the host;
  # only the hub and ha-init reach it on the internal network.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: vahub-homeassistant
    volumes:
      - ha-config:/config
      # configuration.yaml is the committed file (live-editable); .storage and
      # onboarding state live in the ha-config volume and are wiped by `down -v`.
      - ./homeassistant/config/configuration.yaml:/config/configuration.yaml:ro
    environment:
      TZ: Europe/Zurich
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/manifest.json').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot: onboards HA headlessly and writes a long-lived token to ha-tokens.
  # Reuses the hub image (it has httpx + websockets). Runs as root only to write
  # the shared volume; the token file it writes is world-readable for the hub.
  ha-init:
    image: vahub:dev
    container_name: vahub-ha-init
    user: root
    entrypoint: ["/opt/vh/hub/bin/python", "/onboard.py"]
    environment:
      HA_URL: http://homeassistant:8123
      HA_TOKEN_OUT: /tokens/ha_token
    volumes:
      - ./homeassistant/init/onboard.py:/onboard.py:ro
      - ha-tokens:/tokens
    depends_on:
      homeassistant:
        condition: service_healthy
    restart: "no"

  # Self-hosted push-notification server (ntfy). Same idea as the homeassistant
  # service: a real backend running in the sandbox instead of talking to a
  # third-party cloud. Published to the host (not loopback-only, unlike the
  # hub) because your phone needs to reach it directly.
  ntfy:
    image: binwiederhier/ntfy
    container_name: vahub-ntfy
    command: serve
    ports:
      # 0.0.0.0, on purpose: the ntfy app on your phone connects to this port.
      # For access from outside your LAN (WAN), forward this port on your
      # router to this host, or put it behind the existing mTLS proxy /
      # Tailscale instead of opening it directly.
      - "2586:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    environment:
      TZ: Europe/Zurich
      # What ntfy advertises as its own address (used in links it generates).
      # "localhost" only works on this machine: set NTFY_BASE_URL in
      # environment/.env to this host's LAN IP or domain so your phone can
      # subscribe, e.g. NTFY_BASE_URL=http://192.168.196.3:2586
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://localhost:2586}"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # Anyone who knows the topic name can read/publish to it by default.
      # Fine for a private/obscure topic name; tighten with NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # plus `docker compose exec ntfy ntfy user add ...` if you want real auth.
      NTFY_AUTH_DEFAULT_ACCESS: "read-write"
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://127.0.0.1:80/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # M2: TLS + mTLS auth proxy. Opt-in via `--profile tls` (see `sandbox.sh tls`).
  # The hub has no auth code; this is the only authenticated way in. Requires
  # certs from ./proxy/gen-certs.sh. In prod the hub would not publish 8080 at
  # all and only the proxy would be reachable.
  proxy:
    image: caddy:2
    container_name: vahub-proxy
    profiles: ["tls"]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/certs:/certs:ro
    depends_on:
      - hub
    restart: "no"

volumes:
  vahub-state:
  ha-config:
  ha-tokens:
  ntfy-data:
  ntfy-cache:
