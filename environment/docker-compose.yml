# The sandbox stack. You should not need to edit this file to configure things:
# every knob comes from the single ../.env (see ../.env.example). Start it with
# ../sandbox.sh, which passes --env-file for you.
services:
  hub:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: vahub:dev
    container_name: vahub
    # Every VAHUB_* setting in ../.env reaches the hub, so the whole config
    # model is settable from that one file without touching this one.
    env_file: ../.env
    ports:
      # HUB_BIND=127.0.0.1 restricts this to the local machine. The hub has no
      # authentication of its own: whoever reaches this port can drive it.
      - "${HUB_BIND:-0.0.0.0}:${HUB_PORT:-8080}:8080"
    volumes:
      # Live code, read-only from inside the container.
      - ../project:/app/project:ro
      # The structured config (policy, schedules, module manifests).
      - ../config:/etc/vahub:ro
      # Disposable state: SQLite DB, audit log. Wiped by `sandbox.sh reset`.
      - vahub-state:/var/lib/vahub
      # The HA long-lived token written by ha-init (demo mode only).
      - ha-tokens:/tokens:ro
    environment:
      # Demo mode talks to the simulated Home Assistant on the internal network
      # and uses the token ha-init generates. The real-ha overlay replaces both
      # with your instance from ../.env. (environment: overrides env_file:.)
      HA_URL: http://homeassistant:8123
      HA_TOKEN: ""
      HA_TOKEN_FILE: /tokens/ha_token
      HA_VERIFY_SSL: "false"
      # Where the notify module sends pushes: the sandbox's own ntfy by default.
      NTFY_URL: "${NTFY_URL:-http://ntfy:80}"
    depends_on:
      homeassistant:
        condition: service_healthy
      ha-init:
        condition: service_completed_successfully
      ntfy:
        condition: service_healthy
    # The hub manages its own module subprocesses; a hub crash should be visible,
    # not silently restarted.
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Real Home Assistant with virtual devices from ../config/homeassistant.yaml.
  # No physical hardware. First boot takes 30-60s. Not published to the host;
  # only the hub and ha-init reach it on the internal network.
  # Not started in real-ha mode (see docker-compose.realha.yml).
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: vahub-homeassistant
    volumes:
      - ha-config:/config
      # The device definitions are a committed, live-editable file; onboarding
      # state lives in the ha-config volume and is wiped by `sandbox.sh reset`.
      - ../config/homeassistant.yaml:/config/configuration.yaml:ro
    environment:
      TZ: "${VAHUB_TIMEZONE:-Europe/Zurich}"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/manifest.json').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # One-shot: onboards the simulated HA headlessly and writes a long-lived token
  # to the ha-tokens volume. Reuses the hub image (it has httpx + websockets).
  # Runs as root only so it can write that shared volume.
  ha-init:
    image: vahub:dev
    container_name: vahub-ha-init
    user: root
    entrypoint: ["/opt/vh/hub/bin/python", "/onboard.py"]
    environment:
      HA_URL: http://homeassistant:8123
      HA_TOKEN_OUT: /tokens/ha_token
    volumes:
      - ./homeassistant/init/onboard.py:/onboard.py:ro
      - ha-tokens:/tokens
    depends_on:
      homeassistant:
        condition: service_healthy
    restart: "no"

  # Self-hosted push notifications. Published on all interfaces on purpose:
  # your phone connects to this port directly. Anyone who knows the topic can
  # read and post to it, so pick an unguessable NTFY_TOPIC or enable ntfy auth.
  ntfy:
    image: binwiederhier/ntfy
    container_name: vahub-ntfy
    command: serve
    ports:
      - "${NTFY_PORT:-2586}:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    environment:
      TZ: "${VAHUB_TIMEZONE:-Europe/Zurich}"
      # Must be an address your phone can reach, not localhost.
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://localhost:2586}"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_DEFAULT_ACCESS: "${NTFY_AUTH_DEFAULT_ACCESS:-read-write}"
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://127.0.0.1:80/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # TLS termination + client-certificate auth. Opt-in: `sandbox.sh up --tls`.
  # The hub has no auth code; this is the only authenticated way in. Needs certs
  # from ./proxy/gen-certs.sh.
  proxy:
    image: caddy:2
    container_name: vahub-proxy
    profiles: ["tls"]
    ports:
      - "127.0.0.1:${PROXY_PORT:-8443}:8443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/certs:/certs:ro
    depends_on:
      - hub
    restart: "no"

volumes:
  vahub-state:
  ha-config:
  ha-tokens:
  ntfy-data:
  ntfy-cache:
